<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A0E0A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF8F5" media="(prefers-color-scheme: light)" />
    <title>Roast & Route | Premier 3D Coffee Store Locator & Caffeine Intelligence</title>
    <link rel="canonical" href="https://roastandroute.coffee/" />
    
    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="Roast & Route | Premier 3D Coffee Store Locator & Caffeine Intelligence" />
    <meta name="description" content="Find the top artisanal roasteries, specialty third-wave cafes, and drive-thrus across North America. Real-time GPS distance, interactive 3D brew preview, personalized daily caffeine wellness guide, mobile ordering, and loyalty rewards." />
    <meta name="keywords" content="coffee store locator, specialty coffee USA, cafe near me, third wave coffee, daily caffeine tracker, cortado, cold brew, artisan roasters, mobile order coffee" />
    <meta name="author" content="Roast & Route North America" />
    <meta name="robots" content="index, follow" />
    
    <!-- Geo Meta Tags for North America / USA -->
    <meta name="geo.region" content="US" />
    <meta name="geo.position" content="37.7749;-122.4194" />
    <meta name="ICBM" content="37.7749, -122.4194" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://roastandroute.coffee/" />
    <meta property="og:title" content="Roast & Route | Find Your Perfect Coffee Nearby" />
    <meta property="og:description" content="Discover nearby artisanal coffee shops, 3D interactive coffee experience, personalized caffeine tracking, and seamless mobile ordering." />
    <meta property="og:image" content="/assets/og-coffee.webp" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://roastandroute.coffee/" />
    <meta property="twitter:title" content="Roast & Route | Coffee Discovery & Daily Caffeine Intelligence" />
    <meta property="twitter:description" content="Locate top-rated coffee roasteries near you with real-time distance, personalized wellness intake recommendations, and instant curbside pickup." />

    <!-- JSON-LD Structured Data for LocalBusiness and Generative Engine Optimization (GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://roastandroute.coffee/#website",
          "url": "https://roastandroute.coffee/",
          "name": "Roast & Route",
          "description": "Artisanal Coffee Shop Locator & Personalized Caffeine Tracking for North America",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://roastandroute.coffee/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "CoffeeShop",
          "@id": "https://roastandroute.coffee/#service",
          "name": "Roast & Route Specialty Coffee Network",
          "servesCuisine": "Specialty Coffee, Artisanal Pastries, Cold Brew",
          "priceRange": "$$",
          "currenciesAccepted": "USD",
          "paymentAccepted": "Credit Card, Apple Pay, Google Pay, Loyalty Points",
          "areaServed": {
            "@type": "Country",
            "name": "United States"
          },
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Artisanal Brews",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "MenuItem",
                  "name": "Brown Sugar Oat Cortado",
                  "description": "Double ristretto over silky oat milk with organic dark brown sugar and Ceylon cinnamon"
                }
              },
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "MenuItem",
                  "name": "Kyoto-Style Cold Brew",
                  "description": "18-hour slow drip single-origin Ethiopian Yirgacheffe with floral jasmine and bergamot notes"
                }
              }
            ]
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://roastandroute.coffee/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Roast & Route calculate personalized daily caffeine recommendations?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Our wellness engine factors in your age bracket, bedtime target, caffeine sensitivity, and time-of-day cortisol cycles using a biological caffeine half-life curve (~5.5 hours)."
              }
            },
            {
              "@type": "Question",
              "name": "What distinguishes third-wave specialty coffee roasters featured on the app?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Featured roasters roast single-origin heirloom Arabica beans sourced directly from independent farmers at ethical trade premiums."
              }
            }
          ]
        }
      ]
    }
    </script>
